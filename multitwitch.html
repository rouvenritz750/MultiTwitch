<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-Twitch</title>
<script src="https://embed.twitch.tv/embed/v1.js"></script>
<style>
  :root { --bg:#14121a; --panel:#1e1b27; --line:#322e40; --text:#ece9f5; --dim:#9a94ad; --accent:#9d7cff; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--text); font:15px/1.4 system-ui,sans-serif; display:flex; flex-direction:column; }
  header { display:flex; gap:10px; padding:10px 12px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; align-items:center; }
  header h1 { font-size:16px; margin:0 8px 0 0; }
  input { background:var(--bg); border:1px solid var(--line); color:var(--text); padding:8px 10px; border-radius:6px; min-width:0; flex:1 1 160px; max-width:260px; }
  button { background:var(--accent); color:#17122b; border:0; padding:8px 14px; border-radius:6px; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--dim); border:1px solid var(--line); }
  #grid { flex:1; display:grid; gap:6px; padding:6px; min-height:0; }
  .tile { position:relative; background:#000; border:2px solid transparent; border-radius:6px; overflow:hidden; min-height:0; }
  .tile.active { border-color:var(--accent); }
  .player { position:absolute; inset:0; }
  .player iframe { width:100%; height:100%; border:0; }
  .bar { position:absolute; left:0; right:0; top:0; display:flex; gap:6px; padding:6px; z-index:2; background:linear-gradient(#000a,#0000); opacity:0; transition:opacity .15s; }
  .tile:hover .bar, .tile.active .bar, .tile:focus-within .bar { opacity:1; }
  .bar span { flex:1; font-weight:600; align-self:center; text-shadow:0 1px 3px #000; }
  .bar button { padding:5px 10px; font-size:13px; }
  .bar .rm { background:#0008; color:#fff; }
  .empty { margin:auto; color:var(--dim); text-align:center; padding:20px; }
  @media (max-width:700px){ #grid { overflow:auto; } }
</style>
</head>
<body>
<header>
  <h1>Multi-Twitch</h1>
  <input id="name" placeholder="Kanalname, z. B. shroud" autocomplete="off">
  <button id="add">Hinzufügen</button>
  <button id="clear" class="ghost">Alle entfernen</button>
</header>
<main id="grid"></main>

<script>
  const grid = document.getElementById('grid');
  const input = document.getElementById('name');
  const parent = location.hostname || 'localhost';
  let channels = [], active = null;
  const players = {};

  try { channels = JSON.parse(localStorage.getItem('mt_channels') || '[]'); active = localStorage.getItem('mt_active'); } catch(e) {}
  if (!channels.includes(active)) active = channels[0] || null;

  function save() {
    try { localStorage.setItem('mt_channels', JSON.stringify(channels)); localStorage.setItem('mt_active', active || ''); } catch(e) {}
  }

  function applyAudio() {
    for (const ch of channels) {
      const p = players[ch];
      const tile = document.getElementById('tile-' + ch);
      if (tile) tile.classList.toggle('active', ch === active);
      if (p && p.setMuted) { try { p.setMuted(ch !== active); if (ch === active) p.setVolume(1); } catch(e) {} }
    }
  }

  function layout() {
    const n = channels.length;
    const cols = n <= 1 ? 1 : n <= 2 ? 2 : n <= 4 ? 2 : n <= 6 ? 3 : n <= 9 ? 3 : 4;
    const rows = Math.max(1, Math.ceil(n / cols));
    grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0,1fr))`;
    grid.style.gridTemplateRows = `repeat(${rows}, minmax(0,1fr))`;
    if (!n && !grid.querySelector('.empty')) {
      grid.innerHTML = '<div class="empty">Noch kein Stream. Gib oben einen Kanalnamen ein.</div>';
      grid.style.gridTemplateColumns = '1fr'; grid.style.gridTemplateRows = '1fr';
    }
  }

  function addTile(ch) {
    const empty = grid.querySelector('.empty'); if (empty) empty.remove();
    const tile = document.createElement('div');
    tile.className = 'tile'; tile.id = 'tile-' + ch;
    tile.innerHTML = `<div class="bar"><span>${ch}</span><button class="snd">Ton</button><button class="rm">✕</button></div><div class="player" id="pl-${ch}"></div>`;
    grid.appendChild(tile);
    tile.querySelector('.snd').onclick = () => { active = ch; save(); applyAudio(); };
    tile.querySelector('.rm').onclick = () => removeChannel(ch);
    players[ch] = new Twitch.Player('pl-' + ch, { channel: ch, parent: [parent], muted: true, autoplay: true, width: '100%', height: '100%' });
    players[ch].addEventListener(Twitch.Player.READY, applyAudio);
  }

  function addChannel(raw) {
    const ch = raw.trim().toLowerCase().replace(/^https?:\/\/(www\.)?twitch\.tv\//, '').replace(/[^a-z0-9_]/g, '');
    if (!ch || channels.includes(ch)) return;
    channels.push(ch);
    if (!active) active = ch;
    addTile(ch); layout(); applyAudio(); save();
  }

  function removeChannel(ch) {
    channels = channels.filter(c => c !== ch);
    delete players[ch];
    const t = document.getElementById('tile-' + ch); if (t) t.remove();
    if (active === ch) active = channels[0] || null;
    layout(); applyAudio(); save();
  }

  document.getElementById('add').onclick = () => { addChannel(input.value); input.value = ''; input.focus(); };
  input.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('add').click(); });
  document.getElementById('clear').onclick = () => { [...channels].forEach(removeChannel); };

  channels.slice().forEach(ch => addTile(ch));
  layout(); applyAudio();
</script>
</body>
</html>
